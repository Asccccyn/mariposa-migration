<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mariposa</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --fg:#e8e6e1; --dim:#9aa0a8;
          --accent:#7ab8ad; --warn:#d9a05b; --err:#c96a6a; --ok:#8fbf8f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center;
           padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0 12px 0 0; color:var(--accent); letter-spacing:.5px; }
  header .who { display:flex; gap:6px; align-items:center; }
  select, input, button, textarea { background:#111318; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; max-width:100%; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#10231f; border-color:transparent; font-weight:600; }
  button.danger { background:transparent; color:var(--err); border-color:var(--err); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { color:var(--dim); font-size:12px; }
  nav { display:flex; gap:4px; padding:8px 16px 0; flex-wrap:wrap; }
  nav button { border:none; background:transparent; color:var(--dim); padding:6px 12px;
               border-radius:8px 8px 0 0; }
  nav button.active { background:var(--panel); color:var(--accent); }
  main { padding:12px 16px; max-width:1200px; margin:0 auto; }
  section.page { display:none; background:var(--panel); border:1px solid var(--line);
            border-radius:0 10px 10px 10px; padding:14px; }
  section.page.active { display:block; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns:1fr; } }
  .item { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; min-width:0; }
  .item .meta { color:var(--dim); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px;
         border:1px solid var(--line); color:var(--dim); }
  .tag.full { color:var(--ok); border-color:var(--ok); }
  .tag.forgotten_summary { color:var(--warn); border-color:var(--warn); }
  .tag.state-draft { color:var(--dim); }
  .tag.state-submitted { color:var(--accent); border-color:var(--accent); }
  .tag.state-approved_and_applied { color:var(--ok); border-color:var(--ok); }
  .tag.state-rejected { color:var(--err); border-color:var(--err); }
  .tag.state-pending { color:var(--warn); border-color:var(--warn); }
  pre.hash { font-size:11px; color:var(--dim); white-space:pre-wrap; word-break:break-all; margin:6px 0; }
  textarea { width:100%; min-height:54px; resize:vertical; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .empty { color:var(--dim); font-style:italic; }
  .err { color:var(--err); font-size:12px; margin-top:6px; white-space:pre-wrap; }
  .mem-detail { border-top:1px dashed var(--line); margin-top:8px; padding-top:8px;
                white-space:pre-wrap; }
  code { background:#111318; padding:1px 5px; border-radius:4px; font-size:12px; }
  table.cal { border-collapse:collapse; width:100%; table-layout:fixed; }
  table.cal th, table.cal td { border:1px solid var(--line); text-align:center;
    padding:4px; font-size:12px; height:44px; vertical-align:top; cursor:pointer; }
  table.cal td.has { background:#22303a; color:var(--accent); font-weight:600; }
  table.cal td.selected { outline:2px solid var(--accent); }
  table.cal td.other { color:#4a4f57; }
  .day-items { margin-top:12px; }
  /* ── 原文 Source Layer ── */
  .src-conv { cursor:pointer; }
  .src-msg { display:flex; flex-direction:column; margin:8px 0; align-items:flex-start; }
  .src-msg.human { align-items:flex-end; }
  .src-meta { font-size:11px; color:var(--dim); display:flex; gap:8px; align-items:center; margin-bottom:3px; }
  .src-bubble { max-width:82%; border-radius:12px; padding:8px 12px; border:1px solid var(--line);
                background:#111318; white-space:pre-wrap; word-break:break-word; font-size:13px; }
  .src-msg.human .src-bubble { background:#1d2b30; border-color:#2c4a4a; }
  .src-badge { display:inline-block; padding:0 7px; border-radius:10px; font-size:10px;
               border:1px solid var(--line); color:var(--dim); }
  .src-badge.think { color:var(--warn); border-color:var(--warn); }
  .src-badge.tool { color:#8fa8d9; border-color:#415a8a; }
  .src-evidence { max-width:82%; }
  .src-evidence details { border:1px dashed var(--line); border-radius:8px; padding:4px 8px;
                          margin-top:3px; font-size:11px; color:var(--dim); }
  .src-evidence pre { white-space:pre-wrap; word-break:break-all; max-height:220px; overflow:auto;
                      font-size:11px; }
  .src-md p { margin:.3em 0; } .src-md h1,.src-md h2,.src-md h3 { font-size:1em; margin:.4em 0 .2em; }
  .src-md code { background:#0c0e12; padding:0 4px; border-radius:3px; }
  .src-md pre { background:#0c0e12; padding:8px; border-radius:6px; overflow-x:auto; margin:.4em 0; }
  .src-md pre code { background:transparent; padding:0; }
  .src-md ul,.src-md ol { padding-left:1.4em; margin:.3em 0; }
</style>
</head>
<body>
<header>
  <h1>mariposa</h1>
  <div class="who">
    <select id="who">
      <option value="qiaosheng">江乔生（qiaosheng）</option>
      <option value="jiaming">周家明（jiaming）</option>
      <option value="worker">工具人（worker）</option>
    </select>
    <input id="token" placeholder="token" size="26" />
    <button id="saveToken">连接</button>
  </div>
  <span id="status"></span>
</header>

<nav>
  <button data-page="memSec" class="active">记忆 / 检索</button>
  <button data-page="planSec">计划</button>
  <button data-page="srcSec">原文</button>
  <button data-page="delSec">删除申请</button>
</nav>

<main>
  <!-- 记忆 -->
  <section class="page active" id="memSec">
    <div class="row">
      <input id="q" placeholder="关键词，例如：蓝瓷小钥匙" style="flex:1" />
      <button id="searchBtn" class="primary">搜索</button>
      <select id="holdCat">
        <option value="daily">日常</option><option value="milestone">重大转折</option>
        <option value="sad">伤心的事</option><option value="sweet">甜蜜</option>
        <option value="date">约会</option><option value="sex">做爱</option>
        <option value="anniversary">纪念</option><option value="reloplay">剧本</option>
        <option value="plan">计划</option>
      </select>
      <button id="newHoldBtn">写记忆</button>
    </div>
    <div id="memResults"></div>
  </section>

  <!-- 计划 -->
  <section class="page" id="planSec">
    <div class="row">
      <input id="planTitle" placeholder="新计划标题" style="flex:1" />
      <select id="planState">
        <option>planned</option><option>active</option><option>waiting</option>
        <option>blocked</option><option>done</option><option>cancelled</option>
      </select>
      <input id="planDue" type="date" />
      <button id="planAdd" class="primary">创建</button>
    </div>
    <div id="planList"></div>
  </section>

  <!-- 她的话 -->
  <section class="page" id="srcSec">
    <div class="row">
      <input type="file" id="srcFile" accept=".json,.zip" />
      <button id="srcUploadBtn" class="primary">上传并导入</button>
      <span class="empty" id="srcUploadNote">Claude conversations.json / 导出 zip；母本入 Raw Archive</span>
    </div>
    <div class="row">
      <input id="srcPath" placeholder="或输入宿主本地路径 /path/to/conversations.json" style="flex:1" />
      <button id="srcImportPathBtn">从路径导入</button>
      <button id="srcBatchesBtn">导入批次</button>
    </div>
    <div id="srcBatches"></div>
    <div class="row" style="margin-top:12px">
      <input id="srcQ" placeholder="全文关键词（只查双方正文；专项检索，不是记忆召回）" style="flex:2" />
      <select id="srcSender">
        <option value="">双方正文（默认）</option>
        <option value="human">只她的（human）</option>
        <option value="assistant">只他的（assistant）</option>
        <option value="system,tool,unknown">系统/工具/未知（证据面）</option>
      </select>
      <input type="date" id="srcDateFrom" />
      <input type="date" id="srcDateTo" />
      <button id="srcSearchBtn" class="primary">搜原文</button>
    </div>
    <div id="srcResults"></div>
    <div id="srcConvView"></div>
    <div id="srcConvList"></div>
  </section>

  <!-- 删除申请 -->
  <section class="page" id="delSec">
    <div class="row">
      <input id="delTarget" placeholder="memory_id" style="flex:1" />
      <input id="delReason" placeholder="理由（必填）" style="flex:1" />
      <button id="delSubmit" class="danger">提交删除申请</button>
    </div>
    <p class="empty">规则与旧系统一致：理由必填；每日 10 条上限；同一资源 5 次上限；仅周家明审批。审批通过前内容不变。</p>
    <div id="delList"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { token: localStorage.getItem('mariposa_token') || '',
                who: localStorage.getItem('mariposa_who') || 'qiaosheng',
                calY: null, calM: null, calSel: null };
$('who').value = state.who;
$('token').value = state.token;

function setStatus(t, isErr) {
  $('status').textContent = t;
  $('status').style.color = isErr ? 'var(--err)' : 'var(--dim)';
}

async function api(capability, arguments_, idem) {
  const headers = { 'Authorization': 'Bearer ' + state.token,
                    'Content-Type': 'application/json' };
  if (idem) headers['Idempotency-Key'] = idem;
  const res = await fetch('/api/capability/' + capability, {
    method: 'POST', headers,
    body: JSON.stringify({ arguments: arguments_ || {} }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((body.error && body.error.code) + ': ' +
    ((body.error && (body.error.message || body.error.detail)) || res.status));
  return body.data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- 导航 ----------
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('section.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $(btn.dataset.page).classList.add('active');
    if (btn.dataset.page === 'planSec') loadPlans();
    if (btn.dataset.page === 'srcSec') loadSourceConvs();
    if (btn.dataset.page === 'delSec') loadDeletions();
  };
});

// ---------- 记忆 ----------
$('saveToken').onclick = () => {
  state.token = $('token').value.trim();
  state.who = $('who').value;
  localStorage.setItem('mariposa_token', state.token);
  localStorage.setItem('mariposa_who', state.who);
  searchMemories('');
};
$('searchBtn').onclick = () => searchMemories($('q').value);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') searchMemories($('q').value); });
$('newHoldBtn').onclick = async () => {
  const text = prompt('记忆正文', '');
  if (!text) return;
  // CB-053（2026-10-02 审计 P3）：正式写入不再伪造固定 40 天前的
  // exact 事件日期（旧实现把合成测试夹具当默认行为）。日期由用户
  // 提供或显式 unknown；示例数据仅在 console 提示。
  const dateStr = prompt('发生日期（YYYY-MM-DD，留空=不确定）', '');
  const trimmed = dateStr ? dateStr.trim() : '';
  try {
    const d = await api('memory.hold', {
      categories: [document.getElementById('holdCat').value],
      text, why_remember: null,
      memory_date: trimmed || null,
      date_confidence: trimmed ? 'exact' : 'unknown',
    });
    setStatus('已写入 ' + d.memory_id + ' v' + d.version);
    searchMemories('');
  } catch (e) { setStatus(e.message, true); }
};

async function searchMemories(q) {
  const box = $('memResults');
  try {
    const d = await api('memory.search', { query: q || '' });
    if (!d.hits.length) { box.innerHTML = '<div class="empty">无命中</div>'; return; }
    box.innerHTML = '';
    for (const h of d.hits) {
      const mem = await api('memory.get', { memory_id: h.memory_id });
      const [keeps, words, recols, bindings] = await Promise.all([
        api('memory.keeps.list', { memory_id: h.memory_id }).catch(() => ({ marks: [], active_keepers: [] })),
        api('memory.our_words.list', { memory_id: h.memory_id }).catch(() => ({ words: [] })),
        api('memory.recollections.list', { memory_id: h.memory_id }).catch(() => ({ recollections: [] })),
        api('source.binding.list', { memory_id: h.memory_id }).catch(() => ({ bindings: [] })),
      ]);
      const div = document.createElement('div');
      div.className = 'item';
      // v1.7 八模块：标题/日期/分类/心情/事件/我们的话/回忆/原文绑定 + 阶段
      const mood = mem.mood || null;
      div.innerHTML =
        `<div class="meta"><span>${esc(mem.memory_id)}</span>` +
        `<span class="tag ${esc(mem.representation)}">${mem.representation === 'full' ? 'full' : '旧表示(' + mem.representation + ')'}</span>` +
        `<span>v${mem.version}</span><span>${esc(mem.memory_date || '日期未知')}</span>` +
        (mem.categories || []).map(c => `<span class="tag">${esc(c)}</span>`).join('') +
        (keeps.active_keepers || []).map(k => `<span class="tag full">留·${esc(k)}</span>`).join('') +
        `</div>` +
        (mem.original_title ? `<div class="mem-detail"><strong>${esc(mem.original_title)}</strong></div>` : '') +
        `<div class="mem-detail">${esc(mem.text)}</div>` +
        (mood && (mood.tags || []).length ? `<div class="meta">心情标签: ${mood.tags.map(x => `<span class="tag">${esc(x)}</span>`).join(' ')}</div>` : '') +
        ((words.words || []).length ? `<div class="mem-detail"><em>我们的话：</em>${words.words.map(w => esc(w.speaker) + ': ' + esc(w.text)).join('；')}</div>` : '') +
        ((recols.recollections || []).length ? `<div class="mem-detail"><em>回忆：</em>${recols.recollections.map(r => esc(r.author) + ': ' + esc(r.text)).join('；')}</div>` : '') +
        ((bindings.bindings || []).length ? `<div class="meta">原文绑定 ${bindings.bindings.length} 段（source.memory.open 查看）</div>` : '') +
        `<div class="meta" style="margin-top:6px"><span>matched_by: <code>${esc(h.matched_by)}</code></span></div>`;
      box.appendChild(div);
    }
    if (d.degraded) setStatus('语义检索未配置：' + d.degraded);
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

$('memResults').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-restore]');
  if (!btn || btn.dataset.rep === 'full') return;
  try {
    const d = await api('memory.restore', {
      memory_id: btn.dataset.restore,
      expected_current_version: parseInt(btn.dataset.ver),
    });
    setStatus('已恢复到 v' + d.new_version);
    searchMemories($('q').value);
  } catch (err) { setStatus(err.message, true); }
});

// ---------- 计划 ----------
$('planAdd').onclick = async () => {
  try {
    const args = { title: $('planTitle').value, state: $('planState').value };
    if ($('planDue').value) args.due_at = $('planDue').value;
    const d = await api('plan.create', args);
    setStatus('计划已创建 ' + d.plan_id);
    $('planTitle').value = '';
    loadPlans();
  } catch (e) { setStatus(e.message, true); }
};

async function loadPlans() {
  const box = $('planList');
  try {
    const d = await api('plan.list', {});
    if (!d.plans.length) { box.innerHTML = '<div class="empty">暂无计划</div>'; return; }
    box.innerHTML = '';
    for (const p of d.plans) {
      const div = document.createElement('div');
      div.className = 'item';
      const stateTag = ['active','waiting','blocked'].includes(p.state) ? 'state-submitted'
        : p.state === 'done' ? 'state-approved_and_applied'
        : p.state === 'cancelled' ? 'state-rejected' : 'state-draft';
      div.innerHTML =
        `<div class="meta"><span class="tag ${stateTag}">${esc(p.state)}</span>` +
        `<span>v${p.version}</span><span>${esc(p.starts_at || p.date_start || '')} ${p.due_at ? '→ ' + esc(p.due_at.slice(0, 10)) : ''}</span></div>` +
        `<div class="mem-detail"><strong>${esc(p.title)}</strong>${p.content ? '<br>' + esc(p.content) : ''}</div>` +
        `<div class="row">` +
        [...['active','waiting','blocked','done','cancelled'].filter(s => s !== p.state)]
          .map(s => `<button data-plan="${esc(p.plan_id)}" data-ver="${p.version}" data-s="${s}">${s}</button>`).join('') +
        `</div>`;
      box.appendChild(div);
    }
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
$('planList').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-plan]');
  if (!btn) return;
  try {
    const d = await api('plan.update', {
      plan_id: btn.dataset.plan, expected_version: parseInt(btn.dataset.ver),
      state: btn.dataset.s,
    });
    setStatus('计划已更新 v' + d.version);
    loadPlans();
  } catch (err) { setStatus(err.message, true); loadPlans(); }
});

// ---------- 她的话 ----------
// ---------- 删除申请 ----------
$('delSubmit').onclick = async () => {
  try {
    // RA-011：现行 v2.0 合同——memory_id+reason+operation_id（无
    // action：archive 已退役，申请即物理删除诉求）
    const d = await api('memory.deletion.request', {
      memory_id: $('delTarget').value, reason: $('delReason').value,
      operation_id: 'ui-del-' + Date.now(),
    });
    setStatus('申请已提交：' + d.request_id + '（pending，内容未变）');
    loadDeletions();
  } catch (e) { setStatus(e.message, true); }
};
async function loadDeletions() {
  const box = $('delList');
  try {
    const d = await api('memory.deletion.list', {});
    if (!d.requests.length) { box.innerHTML = '<div class="empty">暂无申请</div>'; return; }
    box.innerHTML = '';
    for (const r of d.requests.slice(0, 30)) {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<div class="meta"><span>${esc(r.request_id || r.id)}</span>` +
        `<span class="tag state-${esc(r.status)}">${esc(r.status)}</span>` +
        `<span>${esc(r.memory_id || '')}</span>` +
        `<span>${esc(r.submitted_local_date || '')}</span></div>` +
        `<div class="mem-detail">理由：${esc(r.human_reason)}${r.rejection_reason ? '<br>拒绝理由：' + esc(r.rejection_reason) : ''}</div>` +
        (r.status === 'pending'
          ? `<div class="row"><button class="primary" data-decide="${esc(r.request_id || r.id)}" data-d="approve">批准（物理删除）</button>` +
            `<button class="danger" data-decide="${esc(r.request_id || r.id)}" data-d="reject">拒绝</button>` +
            `<button data-withdraw="${esc(r.request_id || r.id)}">撤回</button></div>` : '');
      box.appendChild(div);
    }
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
$('delList').addEventListener('click', async (e) => {
  const decide = e.target.closest('button[data-decide]');
  const withdraw = e.target.closest('button[data-withdraw]');
  try {
    if (decide) {
      // RA-011：reject 必填拒绝理由；decide 只带 request_id+decision
      const args = { request_id: decide.dataset.decide,
                     decision: decide.dataset.d };
      if (decide.dataset.d === 'reject') {
        args.rejection_reason = window.prompt('拒绝理由（必填）') || '';
        if (!args.rejection_reason) return;
      }
      const d = await api('memory.deletion.decide', args,
        'del-decide-' + decide.dataset.decide + '-' + decide.dataset.d);
      setStatus(d.decision === 'approve' ? '已批准并执行删除' : '已拒绝');
      loadDeletions();
    } else if (withdraw) {
      await api('memory.deletion.withdraw',
        { request_id: withdraw.dataset.withdraw });
      setStatus('已撤回');
      loadDeletions();
    }
  } catch (err) { setStatus(err.message, true); loadDeletions(); }
});

function refreshAll() { searchMemories(''); }
if (state.token) refreshAll();// ---------- 原文 Source Layer ----------
const srcState = { conv: null, nextSeq: null, hasMore: false };

function srcMd(raw) {
  // 安全 Markdown：先全量 HTML 转义，再做有限转换；链接不加 href（不跳转外部）
  let s = esc(raw);
  const blocks = [];
  s = s.replace(/```([\s\S]*?)```/g, (_, code) => {
    blocks.push('<pre><code>' + code.replace(/^\n/, '') + '</code></pre>');
    return '\x00B' + (blocks.length - 1) + '\x00';
  });
  s = s.replace(/^### (.*)$/gm, '<h3>$1</h3>')
       .replace(/^## (.*)$/gm, '<h2>$1</h2>')
       .replace(/^# (.*)$/gm, '<h1>$1</h1>')
       .replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
       .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  const lines = s.split('\n'); let html = '', inUl = false, inOl = false;
  const closeLists = () => { if (inUl) { html += '</ul>'; inUl = false; }
                             if (inOl) { html += '</ol>'; inOl = false; } };
  for (const ln of lines) {
    const ul = ln.match(/^[-*] (.*)$/), ol = ln.match(/^\d+\. (.*)$/);
    if (ul) { if (!inUl) { closeLists(); html += '<ul>'; inUl = true; }
              html += '<li>' + ul[1] + '</li>'; }
    else if (ol) { if (!inOl) { closeLists(); html += '<ol>'; inOl = true; }
                   html += '<li>' + ol[1] + '</li>'; }
    else if (ln.trim() === '') { closeLists(); html += '</p><p>'; }
    else { closeLists(); html += ln + '\n'; }
  }
  closeLists();
  html = '<p>' + html + '</p>'
    .replace(/<p><\/p>/g, '').replace(/<p>\s*<\/p>/g, '')
    .replace(/\n/g, '<br>');
  html = html.replace(/\x00B(\d+)\x00/g, (_, i) => blocks[+i]);
  return html;
}

function srcTime(t) {
  // CB-005：会话/消息的原始时间 metadata 是用户导入数据，此前直接拼进
  // innerHTML（存储型注入入口）。所有消费点都是 HTML 模板插值，这里
  // 统一转义；显示格式化不承担安全编码，也不依赖值是否合法 ISO。
  return t ? esc(t.replace('T', ' ').replace(/\.\d+.*$/, '')) : '—';
}

function srcMsgHtml(m) {
  const isHuman = m.normalized_sender === 'human';
  const name = m.speaker_display || ({system:'system', tool:'tool', unknown:'未知角色'}[m.normalized_sender] || m.normalized_sender);
  const badges = [];
  if (m.has_thinking) badges.push('<span class="src-badge think">thinking（不入正文）</span>');
  if (m.has_tool_content) badges.push('<span class="src-badge tool">工具内容（不入正文）</span>');
  if (m.id_synthetic) badges.push('<span class="src-badge">缺失UUID·合成ID</span>');
  for (const a of (m.attachments || []))
    badges.push(`<span class="src-badge">附件 ${esc(a.file_name || a.filename || a.title || a.block_type || '')}</span>`);
  let evidence = '';
  if (m.has_thinking || m.has_tool_content || m.normalized_sender === 'unknown' || m.normalized_sender === 'system' || m.normalized_sender === 'tool')
    evidence = '<details><summary>证据内容（thinking / 工具 / 非正文块）</summary>' +
      `<div class="src-md">${srcMd(m.text || '（正文为空；完整结构见 content_json，母本在 Raw Archive）')}</div>` +
      '</details>';
  const body = m.text
    ? `<div class="src-bubble"><div class="src-md">${srcMd(m.text)}</div></div>`
    : `<div class="src-bubble" style="opacity:.6">（无用户可见正文）</div>`;
  return `<div class="src-msg ${isHuman ? 'human' : ''}" id="srcmsg-${esc(m.provider_message_id)}">` +
    `<div class="src-meta"><b>${esc(name)}</b><span class="mono">${srcTime(m.created_at)}</span>` +
    `<span>${esc(m.occurred_date || '')}</span>${badges.join('')}</div>` +
    body + `<div class="src-evidence">${evidence}</div></div>`;
}

async function loadSourceConvs() {
  const box = $('srcConvList');
  try {
    const d = await api('source.conversations.list', { limit: 50 });
    if (!d.conversations.length) {
      box.innerHTML = '<div class="empty">尚无原文：上传 Claude conversations.json 开始</div>'; return;
    }
    box.innerHTML = '<h3 style="margin:14px 0 6px">原文会话（按更新时间）</h3>';
    for (const c of d.conversations) {
      const div = document.createElement('div');
      div.className = 'item src-conv';
      div.innerHTML = `<div><b>${esc(c.title)}</b></div>` +
        `<div class="meta"><span>${c.message_count} 条</span>` +
        `<span>${srcTime(c.first_message_at)} → ${srcTime(c.last_message_at)}</span>` +
        `<code>${esc(c.provider_conversation_id)}</code></div>`;
      div.onclick = () => openSourceConv(c.id, null);
      box.appendChild(div);
    }
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function openSourceConv(convId, aroundSeq) {
  srcState.conv = convId; srcState.nextSeq = null; srcState.hasMore = false;
  const box = $('srcConvView');
  try {
    const d = await api('source.conversation.get', {
      conversation_id: convId, limit: 100,
      ...(aroundSeq != null ? { around_seq: aroundSeq } : {}) });
    renderSourceConv(d, aroundSeq != null);
    if (aroundSeq != null) {
      const el = document.getElementById('srcConvView');
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function renderSourceConv(d, jump) {
  const box = $('srcConvView');
  const c = d.conversation;
  let html = `<div class="item"><div class="row">` +
    `<b style="flex:1">${esc(c.title)}</b>` +
    `<button id="srcConvBack">← 返回列表</button></div>` +
    `<div class="meta"><span>${c.message_count} 条</span>` +
    `<span>会话 ${srcTime(c.created_at)} → ${srcTime(c.updated_at)}</span>` +
    `<code>${esc(c.provider_conversation_id)}</code></div></div>`;
  html += d.messages.map(srcMsgHtml).join('');
  box.innerHTML = html;
  $('srcConvBack').onclick = () => { box.innerHTML = ''; loadSourceConvs(); };
  // CB-023：首屏是升序最早一页，"加载更多"应向后（更晚）翻——此前
  // 接成 before_seq（向前翻且整数 seq 游标覆盖不了同序号组），第
  // 101 条永远看不到。续页统一用服务端复合游标。
  if (d.has_more) wireSrcMore(d.next_after_cursor);
}

function wireSrcMore(cursor) {
  const box = $('srcConvView');
  const row = document.createElement('div');
  row.className = 'row';
  const btn = document.createElement('button');
  btn.textContent = '加载更多消息 ↓';
  row.appendChild(btn); box.appendChild(row);
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      const d2 = await api('source.conversation.get', {
        conversation_id: srcState.conv, after_cursor: cursor, limit: 100 });
      row.remove();
      box.insertAdjacentHTML('beforeend', d2.messages.map(srcMsgHtml).join(''));
      if (d2.has_more) wireSrcMore(d2.next_after_cursor);
    } catch (e) { btn.disabled = false; setStatus(e.message, true); }
  };
}

async function sourceSearch() {
  const box = $('srcResults');
  const q = $('srcQ').value.trim();
  try {
    const args = { limit: 30 };
    if (q) args.query = q;
    const sv = $('srcSender').value;
    if (sv) args.senders = sv.split(',');
    if ($('srcDateFrom').value) args.date_from = $('srcDateFrom').value;
    if ($('srcDateTo').value) args.date_to = $('srcDateTo').value;
    const d = await api('source.search', args);
    if (!d.hits.length) { box.innerHTML = '<div class="empty">原文无命中（默认只查双方正文）</div>'; return; }
    box.innerHTML = `<div class="meta" style="margin-top:10px">原文命中 ${d.hits.length} 条 · ` +
      `<span class="tag">专项检索 · 不属于记忆召回</span></div>`;
    for (const h of d.hits) {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<div class="meta"><b>${esc(h.speaker_display || h.normalized_sender)}</b>` +
        `<span class="mono">${srcTime(h.created_at)}</span><span>${esc(h.occurred_date || '')}</span>` +
        `<span>${esc(h.conversation_title || '')}</span></div>` +
        `<div class="mem-detail">${esc(h.excerpt || h.text || '')}</div>` +
        `<div class="meta"><code>${esc(h.provider_message_id)}</code></div>`;
      div.onclick = () => openSourceConv(h.provider_conversation_id, h.sequence);
      box.appendChild(div);
    }
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function sourceImport(path, filename) {
  setStatus('原文导入中…（大文件流式解析，稍等）');
  try {
    const d = await api('source.import', { path, filename }, 'srcimp-' + Date.now());
    const s = d.stats;
    setStatus(`导入${d.status === 'already_imported' ? '（已存在，幂等返回）' : '完成'}：` +
      `${s.conversations_total} 会话 / ${s.messages_new} 新消息 / ` +
      `human ${s.sender_human} · assistant ${s.sender_assistant} · ` +
      `system/tool/unknown ${s.sender_system + s.sender_tool + s.sender_unknown}` +
      (s.verify_problems && s.verify_problems.length
        ? ` · ⚠ 校验问题 ${s.verify_problems.length}` : ' · 校验通过'));
    loadSourceConvs();
  } catch (e) { setStatus('导入失败：' + e.message, true); }
}

$('srcUploadBtn').onclick = async () => {
  const f = $('srcFile').files[0];
  if (!f) { setStatus('先选择文件', true); return; }
  setStatus(`上传 ${f.name}（${(f.size / 1048576).toFixed(1)} MB）…`);
  try {
    const res = await fetch('/api/source/upload', {
      method: 'PUT', headers: { 'Authorization': 'Bearer ' + state.token }, body: f });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.ok === false) throw new Error(body.error?.code + ': ' + (body.error?.message || res.status));
    await sourceImport(body.data.upload_path, f.name);
  } catch (e) { setStatus('上传失败：' + e.message, true); }
};

$('srcImportPathBtn').onclick = () => {
  const p = $('srcPath').value.trim();
  if (p) sourceImport(p, null);
};
$('srcSearchBtn').onclick = sourceSearch;
$('srcQ').addEventListener('keydown', e => { if (e.key === 'Enter') sourceSearch(); });
$('srcBatchesBtn').onclick = async () => {
  const box = $('srcBatches');
  try {
    const d = await api('source.import.batches', { limit: 20 });
    if (!d.batches.length) { box.innerHTML = '<div class="empty">无导入批次</div>'; return; }
    box.innerHTML = d.batches.map(b =>
      `<div class="item"><div class="meta"><b>${esc(b.batch_id)}</b>` +
      `<span class="tag ${b.status === 'completed' ? 'full' : (b.status === 'failed' ? 'state-rejected' : 'state-pending')}">${esc(b.status)}</span>` +
      `<span>${esc(b.original_filename)}</span><span>${(b.original_bytes / 1048576).toFixed(1)} MB</span>` +
      `<span class="mono">${srcTime(b.import_started_at)}</span></div>` +
      (b.error ? `<div class="err">${esc(b.error)}</div>` : '') +
      `<pre class="hash">${esc(b.sha256)}</pre></div>`).join('');
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
};

</script>
</body>
